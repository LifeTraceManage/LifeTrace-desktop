name: Publish Manual Windows Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/manual-release-requests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/shared/crates/lifetrace-sync-client
            src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        run: node scripts/check-version-consistency.mjs

      - name: Run frontend checks
        run: |
          npm run lint
          npm run test:unit
          npm run web:build

      - name: Run Rust tests
        run: npm run test:rust

      - name: Ensure release credentials and existing latest are safe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Missing RELEASE_TOKEN: cannot publish to LifeTrace-Releases."
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.version -ne "0.3.4") {
            throw "Manual installer request is only for v0.3.4."
          }
          $override = Get-Content src-tauri/tauri.manual.conf.json -Raw | ConvertFrom-Json
          if ($override.bundle.createUpdaterArtifacts -ne $false) {
            throw "Manual installer must not create unsigned updater artifacts."
          }
          $latest = gh api repos/zhouxingxing1279/LifeTrace-Releases/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the existing latest release." }
          if ($latest.tag_name -ne "v0.3.3") {
            throw "Latest stable release is $($latest.tag_name), expected v0.3.3. Aborting to protect updater clients."
          }

      - name: Build and publish NSIS manual installer (no updater signing)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          projectPath: .
          tagName: v0.3.4
          releaseName: LifeTrace v0.3.4 (manual installer)
          releaseBody: |
            LifeTrace v0.3.4 Windows x64 手动安装预发布版。
            
            ⚠️ 本次仅提供 NSIS .exe 安装包。签名私钥配置尚需修复，本次不会生成 .sig 或 latest.json，不会通过应用内自动更新推送。请手动下载并安装。
            
            v0.3.3 稳定版本和其自动更新元数据保持不变。修复原有签名密钥后再发布正式的自动更新版本。
          releaseDraft: false
          prerelease: true
          owner: zhouxingxing1279
          repo: LifeTrace-Releases
          releaseCommitish: main
          args: --verbose --config src-tauri/tauri.manual.conf.json
          uploadUpdaterJson: false

      - name: Verify installer and no updater metadata was published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $release = gh api repos/zhouxingxing1279/LifeTrace-Releases/releases/tags/v0.3.4 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Release v0.3.4 not found." }
          if (-not $release.prerelease) { throw "Unsigned manual installer must remain a prerelease." }
          $installer = @($release.assets | Where-Object { $_.name -eq "LifeTrace_0.3.4_x64-setup.exe" -and $_.size -gt 1000000 })
          if ($installer.Count -ne 1) {
            throw "Expected exactly one non-empty LifeTrace_0.3.4_x64-setup.exe asset."
          }
          $updaterFiles = @($release.assets | Where-Object { $_.name -match '\.sig$|^latest(\.cn)?\.json$' })
          if ($updaterFiles.Count -ne 0) { throw "Manual-only release must not publish updater manifests or signatures." }
          $latest = gh api repos/zhouxingxing1279/LifeTrace-Releases/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne "v0.3.3") {
            throw "Existing stable updater release was unexpectedly changed."
          }
          Write-Output "Manual-only installer verified: $($installer[0].browser_download_url)"
